apiVersion: v1
kind: Service
metadata:
  name: azuredrop-frontend
  namespace: azuredrop
spec:
  type: NodePort

  selector:
    app: azuredrop-frontend

  ports:
    - name: http
      port: 80
      targetPort: 80
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: azuredrop
spec:
  replicas: 1

  selector:
    matchLabels:
      app: azuredrop-frontend

  template:
    metadata:
      labels:
        app: azuredrop-frontend

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: frontend
          image: azuredrop-frontend:k8s
          imagePullPolicy: Never

          ports:
            - containerPort: 80
              name: http

          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true

          readinessProbe:
            httpGet:
              path: /internal-health
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /internal-health
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10

          resources:
            requests:
              cpu: 50m
              memory: 64Mi

            limits:
              cpu: 300m
              memory: 256Mi

      volumes:
        - name: nginx-config
          configMap:
            name: azuredrop-frontend-nginx
