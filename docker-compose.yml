version: '3.8'
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: vektralock
      POSTGRES_PASSWORD: vektralock
      POSTGRES_DB: vektralock
    ports:
      - "5432:5432"
    volumes:
      - vektralock_pgdata:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    restart: unless-stopped
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000"
    ports:
      - "10000:10000"
    volumes:
      - vektralock_azurite:/data

volumes:
  vektralock_pgdata:
  vektralock_azurite:
