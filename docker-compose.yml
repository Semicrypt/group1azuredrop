services:
  postgres:
    image: postgres:15-alpine
    container_name: azuredrop-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: azuredrop
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azuredrop-azurite
    hostname: azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --skipApiVersionCheck"

  api:
    build: .
    container_name: azuredrop-api
    ports:
      - "5001:5001"
    depends_on:
      - postgres
      - azurite
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/azuredrop
      JWT_SECRET: supersecretjwt1234567890
      PORT: 5001
      CORS_ORIGINS: http://localhost:5173
      PUBLIC_BASE_URL: http://localhost:5001
      AZURE_STORAGE_CONNECTION_STRING: DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;
      AZURE_CONTAINER_NAME: drops

volumes:
  pgdata: