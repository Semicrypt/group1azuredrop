server {
    listen 80;
    server_name 13.48.161.78;

    root /var/www/certbot;

    # Let's Encrypt HTTP-01 challenge.
    location ^~ /.well-known/acme-challenge/ {
        default_type text/plain;
        try_files $uri =404;
    }

    # Internal Docker/Nginx health check.
    location = /internal-health {
        access_log off;
        default_type text/plain;
        return 200 "healthy\n";
    }

    # Everything else must use HTTPS.
    location / {
        return 301 https://13.48.161.78$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name 13.48.161.78;

    ssl_certificate /etc/letsencrypt/live/13.48.161.78/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/13.48.161.78/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 12M;

    location = /health {
        proxy_pass http://backend:5000/health;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        proxy_read_timeout 60s;
    }

    location /blob/ {
        proxy_pass http://azurite:10000/;
        proxy_http_version 1.1;

        proxy_set_header Host azurite:10000;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;

        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
