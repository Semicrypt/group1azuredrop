AWSTemplateFormatVersion: "2010-09-09"

Description: >
  CloudDrop customer AWS storage integration.
  Creates the initial private encrypted S3 bucket and
  a least-privilege IAM role that CloudDrop can assume
  using a unique External ID.

Parameters:
  CloudDropPrincipalArn:
    Type: String

    Description: >
      ARN of the CloudDrop AWS principal that is allowed
      to assume the customer storage role.

    AllowedPattern: "^arn:aws:iam::[0-9]{12}:(role|user)/.+$"


  ExternalId:
    Type: String

    NoEcho: true

    MinLength: 20

    Description: >
      Unique External ID generated by CloudDrop for
      this CloudDrop account.


  BucketName:
    Type: String

    Default: ""

    Description: >
      Optional name for the initial CloudDrop S3 bucket.
      Leave blank to allow CloudFormation to generate one.


  EnableVersioning:
    Type: String

    Default: "false"

    AllowedValues:
      - "true"
      - "false"


Conditions:
  HasCustomBucketName:
    !Not
      - !Equals
        - !Ref BucketName
        - ""


  VersioningEnabled:
    !Equals
      - !Ref EnableVersioning
      - "true"


Resources:
  CloudDropStorageBucket:
    Type: AWS::S3::Bucket

    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain

    Properties:
      BucketName:
        !If
          - HasCustomBucketName
          - !Ref BucketName
          - !Ref AWS::NoValue

      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true

      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

      VersioningConfiguration:
        Status:
          !If
            - VersioningEnabled
            - Enabled
            - Suspended

      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads

            Status: Enabled

            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7


  CloudDropAccessRole:
    Type: AWS::IAM::Role

    Properties:
      Description: >
        Allows CloudDrop to access the initial CloudDrop
        bucket and additional CloudDrop-created buckets
        in this AWS account.

      AssumeRolePolicyDocument:
        Version: "2012-10-17"

        Statement:
          - Effect: Allow

            Principal:
              AWS:
                !Ref CloudDropPrincipalArn

            Action:
              - sts:AssumeRole

            Condition:
              StringEquals:
                sts:ExternalId:
                  !Ref ExternalId


      Policies:
        - PolicyName: CloudDropStorageAccess

          PolicyDocument:
            Version: "2012-10-17"

            Statement:

              #
              # Initial CloudFormation bucket.
              #
              - Sid: InitialBucketManagement

                Effect: Allow

                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration

                Resource:
                  - !GetAtt CloudDropStorageBucket.Arn


              - Sid: InitialBucketObjects

                Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject

                Resource:
                  - !Sub "${CloudDropStorageBucket.Arn}/*"


              #
              # Additional buckets created by CloudDrop.
              #
              # CloudDrop enforces:
              #
              # clouddrop-<account-id>-*
              #
              - Sid: CreateCloudDropBuckets

                Effect: Allow

                Action:
                  - s3:CreateBucket

                Resource:
                  - !Sub "arn:aws:s3:::clouddrop-${AWS::AccountId}-*"


              - Sid: ManageCloudDropBuckets

                Effect: Allow

                Action:
                  - s3:DeleteBucket
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                  - s3:PutBucketVersioning
                  - s3:GetBucketPublicAccessBlock
                  - s3:PutBucketPublicAccessBlock
                  - s3:GetEncryptionConfiguration
                  - s3:PutEncryptionConfiguration

                Resource:
                  - !Sub "arn:aws:s3:::clouddrop-${AWS::AccountId}-*"


              - Sid: ManageCloudDropBucketObjects

                Effect: Allow

                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject

                Resource:
                  - !Sub "arn:aws:s3:::clouddrop-${AWS::AccountId}-*/*"


Outputs:
  RoleArn:
    Description: >
      IAM role ARN used by CloudDrop.

    Value:
      !GetAtt CloudDropAccessRole.Arn


  BucketName:
    Description: >
      Initial S3 bucket created for CloudDrop storage.

    Value:
      !Ref CloudDropStorageBucket


  Region:
    Description: >
      AWS region where this stack was deployed.

    Value:
      !Ref AWS::Region


  RoleName:
    Description: >
      IAM role created for CloudDrop.

    Value:
      !Ref CloudDropAccessRole